name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Test
        run: Scripts/test.sh
      - name: Build the app for Apple silicon and Intel
        run: Scripts/build-app.sh
